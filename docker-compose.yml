services:

  redis-master:
    image: redis:7-alpine
    container_name: mm-redis-master
    command: >
      redis-server --save 60 1 --loglevel warning --bind 0.0.0.0
    ports:
      - "6379:6379"
    volumes:
      - redis_master_data:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis-replica-1:
    image: redis:7-alpine
    container_name: mm-redis-replica-1
    command: >
      redis-server --replicaof redis-master 6379 --loglevel warning --bind 0.0.0.0
    ports:
      - "6380:6379"
    depends_on:
      redis-master:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis-replica-2:
    image: redis:7-alpine
    container_name: mm-redis-replica-2
    command: >
      redis-server --replicaof redis-master 6379 --loglevel warning --bind 0.0.0.0
    ports:
      - "6381:6379"
    depends_on:
      redis-master:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  redis_master_data:
    driver: local
